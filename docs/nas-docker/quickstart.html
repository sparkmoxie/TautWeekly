<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=./">
  <link rel="canonical" href="https://sparkmoxie.github.io/TautWeekly/nas-docker/">
  <title>NAS / Docker documentation moved — TautWeekly for Plex</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #080808; color: #f5f5f5; }
    main { width: min(680px, calc(100% - 40px)); padding: 32px; border: 1px solid #343434; border-radius: 18px; background: #171717; }
    h1 { margin-top: 0; }
    a { color: #ffba24; }
    @media (max-width: 600px) { main { padding: 22px; } }
  </style>
  <script>
    (() => {
      const anchors = {
        extract: "quick-start",
        environment: "quick-start",
        build: "quick-start",
        acceptance: "regression",
        schedule: "scheduling",
        operations: "commands",
        backup: "data",
        platforms: "quick-start"
      };
      const requested = window.location.hash.slice(1);
      const target = anchors[requested] || requested;
      const canonical = new URL("./", window.location.href);
      canonical.hash = target;
      window.location.replace(canonical.href);
    })();
  </script>
</head>
<body>
  <main>
    <h1>NAS / Docker documentation has moved</h1>
    <p>Docker Compose, QNAP Container Station, Unraid Apps, and generic NAS installation are now consolidated into one guide.</p>
    <p><a href="./">Open the canonical NAS / Docker guide</a>.</p>
  </main>
</body>
</html>
