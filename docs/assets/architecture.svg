<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">TautWeekly for Plex architecture</title>
  <desc id="desc">Tautulli and optional Plex data flow to the PowerShell renderer, which reads private local state and produces preview and SMTP delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#111113"/><stop offset="1" stop-color="#18181b"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#e5a00d"/><stop offset="1" stop-color="#ffbd2e"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".38"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e5a00d"/></marker>
  </defs>
  <rect width="1200" height="430" rx="20" fill="url(#bg)"/>
  <g fill="none" stroke="#e5a00d" stroke-width="3" marker-end="url(#arrow)">
    <path d="M260 112H480"/><path d="M260 302H480" stroke-dasharray="8 8"/><path d="M720 182H930"/><path d="M720 250H930"/>
  </g>
  <path d="M600 340V292" fill="none" stroke="#85858c" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <g font-family="Inter,Segoe UI,sans-serif" filter="url(#shadow)">
    <g transform="translate(70 57)"><rect width="190" height="110" rx="16" fill="#202024" stroke="#3b3b42"/><text x="95" y="47" fill="#f5f5f5" text-anchor="middle" font-size="22" font-weight="700">Tautulli API</text><text x="95" y="76" fill="#9d9da5" text-anchor="middle" font-size="13">users · activity · history</text></g>
    <g transform="translate(70 247)"><rect width="190" height="110" rx="16" fill="#202024" stroke="#3b3b42"/><text x="95" y="47" fill="#f5f5f5" text-anchor="middle" font-size="22" font-weight="700">Plex API</text><text x="95" y="76" fill="#9d9da5" text-anchor="middle" font-size="13">optional metadata path</text></g>
    <g transform="translate(480 105)"><rect width="240" height="185" rx="20" fill="#211d14" stroke="#e5a00d" stroke-width="2"/><image x="20" y="20" width="52" height="52" href="branding/tautweekly-app-icon-64.png"/><text x="120" y="108" fill="#f7f7f7" text-anchor="middle" font-size="25" font-weight="800">PowerShell engine</text><text x="120" y="138" fill="#b6b6bd" text-anchor="middle" font-size="14">classify · enrich · render</text><text x="120" y="164" fill="#e5a00d" text-anchor="middle" font-size="13">confirmation gates</text></g>
    <g transform="translate(930 55)"><rect width="200" height="110" rx="16" fill="#202024" stroke="#3b3b42"/><text x="100" y="47" fill="#f5f5f5" text-anchor="middle" font-size="22" font-weight="700">Local preview</text><text x="100" y="76" fill="#9d9da5" text-anchor="middle" font-size="13">six browser states</text></g>
    <g transform="translate(930 245)"><rect width="200" height="110" rx="16" fill="#202024" stroke="#3b3b42"/><text x="100" y="47" fill="#f5f5f5" text-anchor="middle" font-size="22" font-weight="700">SMTP delivery</text><text x="100" y="76" fill="#9d9da5" text-anchor="middle" font-size="13">test first · schedule last</text></g>
    <g transform="translate(475 340)"><rect width="250" height="65" rx="15" fill="#18181b" stroke="#4a4a51"/><text x="125" y="28" fill="#f5f5f5" text-anchor="middle" font-size="17" font-weight="700">Private config + state</text><text x="125" y="49" fill="#9d9da5" text-anchor="middle" font-size="12">never included in source or releases</text></g>
  </g>
</svg>
