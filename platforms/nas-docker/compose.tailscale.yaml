services:
  tailscale:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:v1.102.2}
    container_name: tautweekly-tailscale
    hostname: tautweekly-manager
    restart: unless-stopped
    read_only: true
    environment:
      TS_ACCEPT_DNS: "false"
      TS_AUTHKEY: file:/run/secrets/tailscale_authkey
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: tautweekly-manager
      TS_KUBE_SECRET: ""
      TS_SERVE_CONFIG: /config/serve.json
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    secrets:
      - tailscale_authkey
    volumes:
      - ./tailscale/config:/config:ro
      - ./tailscale/state:/var/lib/tailscale
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      tautweekly:
        condition: service_healthy

secrets:
  tailscale_authkey:
    file: ./tailscale/authkey.local
