services:
  tautweekly:
    image: ${TAUTWEEKLY_IMAGE:-ghcr.io/sparkmoxie/tautweekly:latest}
    container_name: tautweekly
    restart: unless-stopped
    read_only: true
    environment:
      TZ: Etc/UTC
      PUID: 1000
      PGID: 1000
      UMASK: "077"
      TAUTWEEKLY_DATA_DIR: /data
      TAUTWEEKLY_CONFIG: /data/config.json
      TAUTWEEKLY_PREVIEW_BASE_URL: ""
      TAUTWEEKLY_MANAGER_ALLOWED_HOSTS: ""
      TAUTWEEKLY_MANAGER_SECURE_COOKIES: "false"
      TAUTWEEKLY_HOST_ADAPTER_API: "2"
    volumes:
      - /share/Container/tautweekly/data:/data
    ports:
      - "8787:8080"
    healthcheck:
      test: ["CMD", "/opt/tautweekly/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    stop_grace_period: 30m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
