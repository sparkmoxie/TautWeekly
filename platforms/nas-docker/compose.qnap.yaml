services:
  tautweekly:
    image: ${TAUTWEEKLY_IMAGE:-ghcr.io/sparkmoxie/tautweekly:__TAUTWEEKLY_RELEASE_VERSION__}
    container_name: tautweekly
    restart: unless-stopped
    read_only: true
    environment:
      TZ: Etc/UTC
      PUID: 1000
      PGID: 1000
      UMASK: "077"
      TAUTWEEKLY_RUNTIME_PROFILE: "server"
      TAUTWEEKLY_DATA_DIR: /data
      TAUTWEEKLY_CONFIG: /data/config.json
      TAUTWEEKLY_PREVIEW_BASE_URL: ""
      TAUTWEEKLY_MANAGER_ALLOWED_HOSTS: ""
      TAUTWEEKLY_MANAGER_SECURE_COOKIES: "false"
      TAUTWEEKLY_FUNNEL_ADAPTER: "disabled"
      TAUTWEEKLY_PACKAGE_KIND: "qnap-container-station"
      TAUTWEEKLY_PACKAGE_VERSION: "__TAUTWEEKLY_RELEASE_VERSION__"
      TAUTWEEKLY_HOST_ADAPTER_API: "4"
    volumes:
      - /share/Container/tautweekly/data:/data
      - /share/Container/tautweekly/tailscale-state:/var/lib/tautweekly-tailscale
    ports:
      - "127.0.0.1:8787:8080"
    healthcheck:
      test: ["CMD", "/opt/tautweekly/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    stop_grace_period: 30m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
      - /run:rw,noexec,nosuid,size=16m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
