services:
  tautweekly:
    image: tautweekly-mac:stable
    container_name: tautweekly
    restart: unless-stopped
    read_only: true
    environment:
      TZ: ${TZ:-Etc/UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-077}
      TAUTWEEKLY_RUNTIME_PROFILE: "desktop"
      TAUTWEEKLY_DATA_DIR: /data
      TAUTWEEKLY_CONFIG: /data/config.json
      TAUTWEEKLY_PREVIEW_BASE_URL: ${PREVIEW_BASE_URL:-}
      TAUTWEEKLY_MANAGER_ALLOWED_HOSTS: ${MANAGER_ALLOWED_HOSTS:-}
      TAUTWEEKLY_MANAGER_SECURE_COOKIES: ${MANAGER_SECURE_COOKIES:-false}
      TAUTWEEKLY_FUNNEL_ADAPTER: ${TAUTWEEKLY_FUNNEL_ADAPTER:-disabled}
      TAUTWEEKLY_PACKAGE_KIND: "mac-docker"
      TAUTWEEKLY_PACKAGE_VERSION: "${TAUTWEEKLY_PACKAGE_VERSION:-__TAUTWEEKLY_RELEASE_VERSION__}"
      TAUTWEEKLY_HOST_ADAPTER_API: "4"
    volumes:
      - ./data:/data
      - tautweekly-tailscale-state:/var/lib/tautweekly-tailscale
    ports:
      - "${PREVIEW_BIND:-127.0.0.1}:${PREVIEW_PORT:-8787}:8080"
    healthcheck:
      test: ["CMD", "/opt/tautweekly/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    stop_grace_period: 30m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
      - /run:rw,noexec,nosuid,size=16m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

volumes:
  tautweekly-tailscale-state:
