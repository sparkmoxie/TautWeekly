name: Container

on:
  push:
    branches: [main]
    paths:
      - 'platforms/nas-docker/**'
      - 'platforms/mac-docker/**'
      - 'manager/**'
      - 'templates/**'
      - 'ca_profile.xml'
      - 'scripts/test-container-image.sh'
      - '.github/workflows/container.yml'
  pull_request:
    paths:
      - 'platforms/nas-docker/**'
      - 'platforms/mac-docker/**'
      - 'manager/**'
      - 'templates/**'
      - 'ca_profile.xml'
      - 'scripts/test-container-image.sh'
      - '.github/workflows/container.yml'
      - '.github/workflows/release.yml'
  workflow_call:
    inputs:
      release_tag:
        description: Full release tag whose images must publish before the release.
        required: true
        type: string
  workflow_dispatch:

jobs:
  nas:
    name: NAS image (amd64 and arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build amd64 runtime smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: platforms/nas-docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: tautweekly-nas-ci:smoke
          build-args: BUILD_VERSION=ci
          cache-from: type=gha,scope=nas
      - name: Boot-test the NAS, Unraid, Linux, and FreeBSD runtime image
        run: ./scripts/test-container-image.sh tautweekly-nas-ci:smoke
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (inputs.release_tag != '' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sparkmoxie/tautweekly
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ inputs.release_tag == '' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=raw,value=latest,enable=${{ inputs.release_tag != '' }}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: platforms/nas-docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (inputs.release_tag != '' || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=nas
          cache-to: type=gha,mode=max,scope=nas
          provenance: mode=max
          sbom: true

  mac:
    name: macOS Docker Desktop image (amd64 and arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build amd64 registry smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: platforms/mac-docker/Dockerfile.registry
          platforms: linux/amd64
          load: true
          tags: tautweekly-mac-ci:smoke
          build-args: BUILD_VERSION=ci
          cache-from: type=gha,scope=mac
      - name: Boot-test the macOS registry runtime image
        run: ./scripts/test-container-image.sh tautweekly-mac-ci:smoke '' mac-registry
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (inputs.release_tag != '' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sparkmoxie/tautweekly-mac
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ inputs.release_tag == '' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=raw,value=latest,enable=${{ inputs.release_tag != '' }}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: platforms/mac-docker/Dockerfile.registry
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (inputs.release_tag != '' || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=mac
          cache-to: type=gha,mode=max,scope=mac
          provenance: mode=max
          sbom: true
