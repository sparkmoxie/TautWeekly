name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  checks: read
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  preflight:
    name: Release history, version, and CI provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require the release tag on current main history
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require matching versions and release notes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Release tags must use vMAJOR.MINOR.PATCH."
          }
          ./scripts/validate-release-history.ps1 -Version $version
      - name: Require the exact tagged commit to have green CI provenance
        uses: actions/github-script@v8
        with:
          script: |
            const checks = await github.rest.checks.listForRef({
              ...context.repo,
              ref: context.sha,
              check_name: 'required',
              filter: 'latest',
              per_page: 100,
            });
            const green = checks.data.check_runs.some(check =>
              check.conclusion === 'success' &&
              check.details_url?.includes('/actions/runs/')
            );
            if (!green) {
              core.setFailed(`The tagged commit ${context.sha} has no successful CI / required check.`);
            }

  build:
    name: Build and validate release candidates
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: manager/go.mod
          cache-dependency-path: |
            manager/go.mod
            installer/go.mod
      - name: Build release archives and checksums once
        shell: pwsh
        run: ./scripts/build-releases.ps1
      - name: Test packaged runtime contracts and checksums
        shell: pwsh
        run: ./scripts/test-release-artifacts.ps1
      - name: Boot-test the packaged native Linux Manager
        run: ./scripts/test-linux-manager-package.sh
      - name: Verify release archive reproducibility
        shell: pwsh
        run: ./scripts/test-release-reproducibility.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v','')
      - name: Test archive integrity and launcher permissions
        run: |
          for file in dist/*.zip; do unzip -t "$file"; done
          for file in dist/*.tar.gz; do tar -tzf "$file" >/dev/null; done
          tar -tvzf dist/TautWeekly-nas-docker.tar.gz TautWeekly-nas-docker/tautweekly.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-nas-docker.tar.gz TautWeekly-nas-docker/app/bin/run-as-user.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-nas-docker.tar.gz TautWeekly-nas-docker/app/bin/runtime-profile.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-nas-docker.tar.gz TautWeekly-nas-docker/app/bin/run-script.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-nas-docker.tar.gz TautWeekly-nas-docker/container-update.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-mac-docker.tar.gz TautWeekly-mac-docker/tautweekly.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-mac-docker.tar.gz TautWeekly-mac-docker/app/bin/run-as-user.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-mac-docker.tar.gz TautWeekly-mac-docker/app/bin/runtime-profile.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-mac-docker.tar.gz TautWeekly-mac-docker/app/bin/run-script.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-mac-docker.tar.gz TautWeekly-mac-docker/check-release.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-mac-docker.tar.gz TautWeekly-mac-docker/mac-update.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-linux.tar.gz TautWeekly-linux/install-linux.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-linux.tar.gz TautWeekly-linux/tautweekly | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-linux.tar.gz TautWeekly-linux/check-release.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-linux.tar.gz TautWeekly-linux/app/bin/run-as-user.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-linux.tar.gz TautWeekly-linux/app/bin/runtime-profile.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-linux.tar.gz TautWeekly-linux/app/bin/run-script.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-linux.tar.gz TautWeekly-linux/manager/tautweekly-manager-linux-amd64 | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-linux.tar.gz TautWeekly-linux/manager/tautweekly-manager-linux-arm64 | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-freebsd-podman.tar.gz TautWeekly-freebsd-podman/install-freebsd.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-freebsd-podman.tar.gz TautWeekly-freebsd-podman/rc.d/tautweekly | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-freebsd-podman.tar.gz TautWeekly-freebsd-podman/app/bin/run-as-user.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-freebsd-podman.tar.gz TautWeekly-freebsd-podman/app/bin/runtime-profile.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-freebsd-podman.tar.gz TautWeekly-freebsd-podman/app/bin/run-script.sh | grep -q '^-rwx'
      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: tautweekly-release-candidates
          path: dist/
          if-no-files-found: error

  windows-installer:
    name: Test Windows installer release candidate
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: tautweekly-release-candidates
          path: dist
      - name: Test isolated install, upgrade, icon, and uninstall lifecycle
        shell: powershell
        run: .\scripts\test-windows-installer.ps1

  container-images:
    name: Publish unified release container image
    needs: [build, windows-installer]
    uses: ./.github/workflows/container.yml
    with:
      release_tag: ${{ github.ref_name }}
      publish_mode: release
      smoke_test: true
      test_arm64: true
    secrets: inherit
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

  publish:
    name: Publish verified release
    runs-on: ubuntu-latest
    needs: [build, windows-installer, container-images]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: tautweekly-release-candidates
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-file "$notes_file" --title "TautWeekly for Plex $GITHUB_REF_NAME"
