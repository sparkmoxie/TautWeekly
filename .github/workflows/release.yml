name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate repository
        shell: pwsh
        run: |
          ./scripts/validate-repository.ps1
          ./scripts/validate-unraid-template.ps1
          ./scripts/validate-platforms.ps1
          ./scripts/check-links.ps1
          ./scripts/validate-docs.ps1
          ./scripts/validate-powershell.ps1
      - name: Validate shell scripts
        run: ./scripts/validate-shell.sh
      - name: Test scheduler timezone behavior
        shell: pwsh
        run: ./scripts/test-scheduler-timezone.ps1
      - name: Validate Compose files
        run: |
          docker compose -f platforms/nas-docker/compose.yaml config --quiet
          docker compose -f platforms/nas-docker/compose.qnap.yaml config --quiet
          docker compose -f platforms/mac-docker/compose.yaml config --quiet
      - name: Build release archives and checksums
        shell: pwsh
        run: ./scripts/build-releases.ps1
      - name: Test launcher permissions
        run: |
          tar -tvzf dist/TautWeekly-nas-docker.tar.gz TautWeekly-nas-docker/tautweekly.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-mac-docker.tar.gz TautWeekly-mac-docker/tautweekly.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-linux.tar.gz TautWeekly-linux/install-linux.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-linux.tar.gz TautWeekly-linux/tautweekly | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-freebsd-podman.tar.gz TautWeekly-freebsd-podman/install-freebsd.sh | grep -q '^-rwx'
          tar -tvzf dist/TautWeekly-freebsd-podman.tar.gz TautWeekly-freebsd-podman/rc.d/tautweekly | grep -q '^-rwx'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "TautWeekly for Plex $GITHUB_REF_NAME"
