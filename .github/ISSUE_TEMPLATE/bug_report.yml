name: Bug report
description: Report a reproducible TautWeekly for Plex problem without exposing private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach `config.json`, `.env`, state, logs, generated mail, API keys, tokens, SMTP credentials, recipient addresses, server names, private addresses, or local paths. Sanitize every excerpt.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows portable
        - NAS / Docker Compose
        - macOS / Docker Desktop
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release or commit
      placeholder: v1.2.3 or commit SHA
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Use sanitized example values only.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Verification output
      description: Paste only the minimal, sanitized failure text.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal data, private infrastructure details, and generated newsletters.
          required: true
